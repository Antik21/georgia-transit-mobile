appId: com.denis.georgiatransit
---
# Precondition: run-offline-route-cache-smoke.sh owns the loopback test fixture and reset the app.
# Seed both native persistence and the durable route list through stable automation IDs only.
- launchApp:
    clearState: false
- assertVisible:
    id: map.screen
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
- extendedWaitUntil:
    visible:
      id: routes.option
    timeout: 15000
- assertNotVisible:
    id: routes.error
- stopApp
