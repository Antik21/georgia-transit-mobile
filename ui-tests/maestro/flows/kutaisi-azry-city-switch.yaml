appId: com.denis.georgiatransit.sandbox
---
# Start the local BFF with the AZRY and Batumi adapters and both city entries enabled.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: city-selection.kutaisi
    timeout: 20000
- tapOn:
    id: city-selection.kutaisi
- tapOn:
    id: city-selection.continue
- extendedWaitUntil:
    visible:
      id: map.nearby-stop
    timeout: 20000
- assertVisible:
    id: map.attribution.link.azry
- longPressOn:
    id: map.nearby-stop
- assertNotVisible:
    id: map.planner.pin
- tapOn:
    id: map.routes
- extendedWaitUntil:
    visible:
      id: routes.option
    timeout: 20000
- tapOn:
    id: routes.option
    index: 0
- tapOn:
    id: routes.confirm
- extendedWaitUntil:
    visible:
      id: map.route-geometry.chip
    timeout: 20000
- tapOn:
    id: map.change-city
- tapOn:
    id: city-selection.batumi
- tapOn:
    id: city-selection.continue
- extendedWaitUntil:
    visible:
      id: map.routes
    timeout: 20000
- assertNotVisible:
    id: map.attribution.link.azry
- assertNotVisible:
    id: map.route-geometry.chip
- tapOn:
    id: map.routes
- extendedWaitUntil:
    visible:
      id: routes.option
    timeout: 20000
- tapOn:
    id: routes.cancel
- assertVisible:
    id: map.screen
