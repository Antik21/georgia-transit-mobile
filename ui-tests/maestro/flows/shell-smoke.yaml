appId: com.denis.georgiatransit
---
- launchApp:
    clearState: true
- assertVisible:
    id: city-selection.screen
- assertVisible:
    id: city-selection.location
- tapOn:
    id: city-selection.tbilisi
- tapOn:
    id: city-selection.continue
- assertVisible:
    id: map.screen
- assertVisible:
    id: map.my-location
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
- tapOn:
    id: routes.option
    index: 0
- tapOn:
    id: routes.option
    index: 1
- tapOn:
    id: routes.confirm
- assertVisible:
    id: map.screen
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
- tapOn:
    id: routes.back
- assertVisible:
    id: map.screen
- tapOn:
    id: map.change-city
- assertVisible:
    id: city-selection.screen
- tapOn:
    id: city-selection.batumi
- tapOn:
    id: city-selection.continue
- assertVisible:
    id: map.screen
