appId: com.denis.georgiatransit
---
# Establish a selected city from a cold first launch, then prove the native store hands it back
# to the common bootstrap gate after the app process is terminated.
- launchApp:
    clearState: true
- assertVisible:
    id: map.screen
- assertNotVisible:
    id: map.change-city
- stopApp
- launchApp:
    clearState: false
- assertVisible:
    id: map.screen
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
- tapOn:
    id: routes.cancel
- assertVisible:
    id: map.screen
