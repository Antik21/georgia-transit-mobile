appId: com.denis.georgiatransit
---
# Precondition: the seed flow succeeded and its owned fixture has been stopped and verified absent.
- launchApp:
    clearState: false
- assertVisible:
    id: map.screen
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
- extendedWaitUntil:
    visible:
      id: routes.option
    timeout: 15000
- assertNotVisible:
    id: routes.error
- stopApp
