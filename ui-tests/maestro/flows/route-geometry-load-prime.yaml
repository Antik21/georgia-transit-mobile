appId: com.denis.georgiatransit
---
# The performance harness supplies a fixture with twenty successful distinct shapes.
- launchApp:
    clearState: true
- assertVisible:
    id: city-selection.screen
- tapOn:
    id: city-selection.demo
- tapOn:
    id: city-selection.continue
- assertVisible:
    id: map.screen
- tapOn:
    id: map.routes
- extendedWaitUntil:
    visible:
      id: routes.option
    timeout: 15000
# Compose exposes only rows in the current LazyColumn semantics tree. G1..G10 are fixed,
# nonlocalized fixture labels, not production IDs. iOS cannot direct scroll its Compose LazyColumn
# through scrollUntilVisible, so bounded relative swipes begin inside its list viewport before G4
# and then each of G7..G10. Every parent tap waits for recomposition; routes.selection-warning is
# the strict 10/10 proof across Android's checked and iOS's selected accessibility semantics.
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G1$"
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G2$"
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G3$"
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G4$"
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G5$"
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G6$"
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 62%
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G7$"
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 62%
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G8$"
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 62%
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G9$"
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 62%
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: routes.option
    containsDescendants:
      - text: "^G10$"
- waitForAnimationToEnd
- assertVisible:
    id: routes.selection-warning
- tapOn:
    id: routes.confirm
- extendedWaitUntil:
    visible:
      id: map.route-geometry.legend
    timeout: 15000
- assertVisible:
    id: map.route-geometry.chip
    index: 0
