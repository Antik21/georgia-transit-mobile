appId: com.denis.georgiatransit
---
# Precondition: the harness grants location, injects a Tbilisi fix, and owns the loopback fixture.
# Selectors are locale-independent IDs; coordinates are setup data only.
- launchApp:
    clearState: false
- assertVisible:
    id: city-selection.screen
- tapOn:
    id: city-selection.demo
- tapOn:
    id: city-selection.continue
- assertVisible:
    id: map.screen
- assertVisible:
    id: map.user-location
- extendedWaitUntil:
    visible:
        id: map.nearby-stop
    timeout: 15000
- tapOn:
    id: map.nearby-stop
    index: 0
- assertVisible:
    id: map.stop-arrivals.sheet
- assertVisible:
    id: map.walking-estimate
- extendedWaitUntil:
    visible:
        id: map.walking-estimate.ready
    timeout: 15000
- extendedWaitUntil:
    visible:
        id: map.stop-arrivals.rows
    timeout: 15000
- assertVisible:
    id: map.stop-arrivals.row
