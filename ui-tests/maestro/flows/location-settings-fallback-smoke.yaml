appId: com.denis.georgiatransit
---
# Precondition: Android harness configures a prior, permanently denied foreground permission.
- launchApp:
    clearState: false
    permissions:
      all: deny
- assertVisible:
    id: map.screen
- assertVisible:
    id: map.content.local-preview
- assertVisible:
    id: map.location-settings
- assertNotVisible:
    id: map.user-location
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
