appId: com.anti.georgiatransit.sandbox
---
# Precondition: Android harness configures a prior, permanently denied foreground permission.
- launchApp:
    clearState: false
    permissions:
      all: deny
- assertVisible:
    id: map.screen
- assertVisible:
    id: map.content.local-preview
- assertVisible:
    id: map.location-settings
- assertNotVisible:
    id: map.user-location
- tapOn:
    id: map.location-settings
- assertVisible:
    id: map.location.permission.sheet
- assertVisible:
    id: map.location.permission.confirm
- tapOn:
    id: map.location.permission.close
- assertNotVisible:
    id: map.location.permission.sheet
- tapOn:
    id: map.routes
- assertVisible:
    id: routes.screen
