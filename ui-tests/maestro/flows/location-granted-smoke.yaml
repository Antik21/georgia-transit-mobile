appId: com.denis.georgiatransit
---
# Precondition: grant foreground location and inject a simulator fix with adb/simctl.
- launchApp:
    clearState: false
- assertVisible:
    id: city-selection.screen
- assertVisible:
    id: city-selection.location
- tapOn:
    id: city-selection.tbilisi
- tapOn:
    id: city-selection.continue
- assertVisible:
    id: map.screen
- assertVisible:
    id: map.my-location
- assertVisible:
    id: map.user-location
