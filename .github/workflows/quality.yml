name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Check formatting
        run: ./gradlew --no-daemon --no-build-cache --stacktrace spotlessCheck

  bff:
    name: Transit BFF
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Build Transit BFF
        run: >-
          ./gradlew --no-daemon --no-build-cache --stacktrace
          spotlessCheck
          :transitBff:check
          :transitBff:build
      - name: Build and smoke-test the production container
        shell: bash
        run: |
          set -euo pipefail
          docker build --file transitBff/Dockerfile --tag transit-bff:ci .
          sh transitBff/deploy/render/smoke-test.sh transit-bff:ci

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The hosted runner must provide ANDROID_HOME}"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Ignore yes(1)'s expected SIGPIPE after sdkmanager accepts all licenses.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Run Android quality gates
        run: >-
          ./gradlew --no-daemon --no-build-cache --stacktrace
          :shared:testAndroidHostTest
          :shared:checkKotlinGradlePluginConfigurationErrors
          :androidApp:lintSandboxDebug
          :androidApp:lintProdRelease
          :androidApp:assembleSandbox
          :androidApp:assembleProd

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The hosted runner must provide ANDROID_HOME}"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Ignore yes(1)'s expected SIGPIPE after sdkmanager accepts all licenses.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Run browser quality gates
        shell: bash
        run: |
          set -euo pipefail
          node --version
          yarn --version
          export CHROME_BIN="$(command -v google-chrome)"
          test -x "$CHROME_BIN"
          ./gradlew --no-daemon --no-build-cache --stacktrace \
            :shared:jsBrowserTest :shared:jsProductionLibraryCompileSync :kotlinNpmInstall
          npm --prefix webApp ci
          npm --prefix webApp run build
          npm --prefix webApp run smoke
      - name: Upload web build
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: georgia-transit-web
          path: webApp/dist/
          if-no-files-found: error
          retention-days: 1

  ios:
    name: iOS
    # Временно отключено, пока доделывается основной функционал. Вернуть: удалить `if`
    # и добавить `ios` в `needs` задачи publish-web.
    if: false
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Provision the Gradle wrapper with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Create an explicit iOS simulator destination
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | jq -r '.runtimes | map(select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))) | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          device_type="$(xcrun simctl list devicetypes -j | jq -r '.devicetypes | map(select(.name | startswith("iPhone"))) | first.identifier')"
          test -n "$runtime" && test "$runtime" != "null"
          test -n "$device_type" && test "$device_type" != "null"
          simulator_udid="$(xcrun simctl create "Georgia Transit CI" "$device_type" "$runtime")"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Run iOS simulator tests and configuration checks
        run: >-
          ./gradlew --no-daemon --no-build-cache --stacktrace
          :shared:iosSimulatorArm64Test
          --device "${{ steps.simulator.outputs.udid }}"
          :shared:checkXcodeProjectConfiguration
      - name: Build both iOS simulator environments without signing
        shell: bash
        run: |
          set -euo pipefail
          for environment in Sandbox Prod; do
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme "$environment" \
              -sdk iphonesimulator \
              -configuration "$environment" \
              -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
              CODE_SIGNING_ALLOWED=NO \
              build
          done
      - name: Delete CI simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        run: xcrun simctl delete "${{ steps.simulator.outputs.udid }}"

  publish-web:
    name: Publish web client
    # Render's static-site build has no JDK or Android SDK, so CI publishes the tested bundle instead.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [quality, bff, android, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-web
      cancel-in-progress: false
    steps:
      - name: Download tested web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: georgia-transit-web
          path: web-dist
      - name: Publish to the web-dist branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f web-dist/index.html
          cd web-dist
          git init --quiet --initial-branch=web-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Publish web client from ${GITHUB_SHA}"
          # A single generated commit keeps the deploy branch free of build history.
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:web-dist
